name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JWT_SECRET: ci-test-secret-not-for-production
  DATABASE_URL: "postgresql://user:pass@localhost:5432/testdb"
  DIRECT_URL: "postgresql://user:pass@localhost:5432/testdb"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails fast (no prisma/build needed). A sync export from a 'use server'
      # module 500s every page that imports it — including /api/session, which
      # takes out login app-wide. TypeScript does not catch it.
      - run: npm run check:server-actions
      # Every mutating server action must say who may run it. A nurse
      # discharged a patient because nothing checked.
      - run: npm run check:action-guards

      - run: npx prisma generate

      - run: npm run check:prisma

      - run: npm run typecheck

      - run: npm run lint:ci

      - run: npm run build
